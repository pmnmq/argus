[package]
name         = "argus-protocol"
description  = "Argus L2：纯计算的协议解析与观测 IR（编译期无 IO，见宪法 C6）"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

# ⚠️ 禁止 tokio / hyper / sqlx / axum / reqwest（宪法 C6、docs/14 §7.2）
#    "解析层不可能阻塞" 这条性质靠依赖树而不是靠自觉来保证。
[dependencies]
argus-core  = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
bytes       = { workspace = true }
memchr      = { workspace = true }
compact_str = { workspace = true }
smallvec    = { workspace = true }
# 纯 derive 宏，无运行时代价、无 IO —— 不违反本 crate 的"纯计算"约束
thiserror   = { workspace = true }

[dev-dependencies]
insta     = { workspace = true }
proptest  = { workspace = true }
rstest    = { workspace = true }
# 只在 bench 里用。dev-dependency 不进 `cargo tree -e normal`，
# 所以不影响 ci/check-invariants.sh 对本 crate 依赖集的断言
criterion = { workspace = true }

# 单帧解析的耗时预算（F05 §7）。不进 CI 门禁，回归门禁是 F28 的活
[[bench]]
name    = "anthropic"
harness = false

[lints]
workspace = true
