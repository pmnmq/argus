[package]
name         = "argus-proxy"
description  = "Argus L3 数据面：ingress / auth / router / upstream / tee / observer / security"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

# ⚠️ 禁止 sqlx / argus-storage（宪法 C6）。
#    数据面对存储的解耦靠 argus-protocol::sink::InteractionSink trait，
#    不是靠调用 argus-storage —— 这条必须在编译期可证（docs/10 §4.1）。
[dependencies]
argus-core     = { workspace = true }
argus-protocol = { workspace = true }

tokio          = { workspace = true }
tokio-util     = { workspace = true }
hyper          = { workspace = true }
hyper-util     = { workspace = true }
http           = { workspace = true }
http-body      = { workspace = true }
pin-project-lite = { workspace = true }
http-body-util = { workspace = true }
axum           = { workspace = true }
tower          = { workspace = true }
tower-http     = { workspace = true }
rustls         = { workspace = true }
hyper-rustls   = { workspace = true }
tokio-rustls   = { workspace = true }
# 只被 testkit 的自签证书用到（见 [features]）
rcgen          = { workspace = true, optional = true }
webpki-roots   = { workspace = true }

serde       = { workspace = true }
serde_json  = { workspace = true }
bytes       = { workspace = true }
memchr      = { workspace = true }
compact_str = { workspace = true }
smallvec    = { workspace = true }
arc-swap    = { workspace = true }
dashmap     = { workspace = true }
parking_lot = { workspace = true }

sha2    = { workspace = true }
subtle  = { workspace = true }
zeroize = { workspace = true }
rand    = { workspace = true }

regex        = { workspace = true }
aho-corasick = { workspace = true }
governor     = { workspace = true }
moka         = { workspace = true }

tracing      = { workspace = true }
metrics      = { workspace = true }
uuid         = { workspace = true }
chrono       = { workspace = true }
thiserror    = { workspace = true }
url          = { workspace = true }
memory-stats = { workspace = true }
rlimit       = { workspace = true }

# Redis 永远是可选的，绝不能成为默认硬依赖（docs/00 §3、docs/09 §8）
redis = { workspace = true, optional = true }

[features]
default = []
redis   = ["dep:redis"]
# MockProvider 与压测驱动。**非默认**：它会把 rcgen 拖进依赖树，
# 而那是一个只在测试里有意义的证书生成库
testkit = ["dep:rcgen"]

[dev-dependencies]
# test-util 只在测试里用：tokio::time::pause 让超时用例秒级跑完而不是真等 30s
tokio     = { workspace = true, features = ["test-util"] }
# 集成测试与 bench 都要用 testkit，这里把自己开着 feature 引一遍
argus-proxy = { workspace = true, features = ["testkit"] }
dhat      = { workspace = true }
insta     = { workspace = true }
proptest  = { workspace = true }
rstest    = { workspace = true }
wiremock  = { workspace = true }
criterion = { workspace = true }

[lints]
workspace = true

# 压测用的两个可执行体。都要 testkit（MockProvider 在那后面），
# 所以 required-features 必须写，否则默认构建会因为找不到模块而失败。
[[example]]
name              = "mock-provider"
required-features = ["testkit"]

[[example]]
name              = "loadgen"
required-features = ["testkit"]
