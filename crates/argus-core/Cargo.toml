[package]
name         = "argus-core"
description  = "Argus L1：被所有层共享的基础类型（无内部依赖，见宪法 C6）"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

# ⚠️ 本 crate 是依赖图的根：禁止依赖任何 argus-* crate（宪法 C6）
#    也禁止 sqlx / hyper（docs/14 §7.2）
[dependencies]
serde       = { workspace = true }
bytes       = { workspace = true }
http        = { workspace = true }
arc-swap    = { workspace = true }
thiserror   = { workspace = true }
uuid        = { workspace = true }
chrono      = { workspace = true }
compact_str = { workspace = true }
smallvec    = { workspace = true }
# ResolvedCredential 的 Drop 清零。手写 `for b in buf { *b = 0 }` 会被优化掉，
# 这正是 zeroize 存在的理由。
zeroize     = { workspace = true }
# Timeouts / RetryPolicy 要能从 TOML 里读 "3s" / "10s" 这样的写法
humantime-serde = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
# 只用于测 serde 表示（newtype 必须透明、Duration 必须读 "3s" 这种写法）。
# dev-only，不进运行时依赖树。
serde_json = { workspace = true }
