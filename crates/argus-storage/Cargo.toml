[package]
name         = "argus-storage"
description  = "Argus L3 存储：PgSink / Spool / repo / 分区维护 / 凭据加解密"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

# sqlx 只允许出现在这里（docs/19 §5.1 判据 A）。禁止依赖 argus-proxy。
[dependencies]
argus-core     = { workspace = true }
argus-protocol = { workspace = true }

sqlx  = { workspace = true }
tokio = { workspace = true }
zstd  = { workspace = true }

serde      = { workspace = true }
serde_json = { workspace = true }
bytes      = { workspace = true }
uuid       = { workspace = true }
tracing    = { workspace = true }
metrics    = { workspace = true }
thiserror  = { workspace = true }

# 凭据加密：master key 不入库，AES-256-GCM，无读取明文的 API（宪法 C27）
aes-gcm = { workspace = true }
argon2  = { workspace = true }
sha2    = { workspace = true }
subtle  = { workspace = true }
zeroize = { workspace = true }
rand    = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
insta  = { workspace = true }

[lints]
workspace = true
