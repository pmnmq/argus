# cargo-deny 配置（F01 R9）。
# 运行：cargo deny check
#
# 四类检查各自的态度：
#   advisories —— deny：已知漏洞不许进
#   licenses   —— deny：只放行明确列出的宽松许可证
#   bans       —— warn 为主：重复依赖是常态，但要看得见
#   sources    —— deny：只允许 crates.io

[graph]
all-features = true

[advisories]
version = 2
yanked  = "deny"
ignore  = [
  # 格式：{ id = "RUSTSEC-YYYY-NNNN", reason = "为什么可以忍受 + 何时复查" }
  # 加入任何一条都必须写明复查时间，禁止无限期豁免。
]

[licenses]
version = 2
# 只允许这些许可证。新增条目需要在 PR 中说明。
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  # Mozilla 根证书数据（webpki-roots）用的是数据许可证，不是代码许可证
  "CDLA-Permissive-2.0",
]
# 刻意不预先放行 MPL-2.0 / OpenSSL：宁可等真的有依赖用到时 CI 报红、
# 由人来决定收不收，也不要维护一张"以防万一"的白名单。
confidence-threshold = 0.9
# 不写 [[licenses.clarify]]：它需要 license 文件的精确哈希，写错会让 CI 因为
# 一个和依赖本身无关的原因变红。ring 的 OpenSSL 条款已在上面的 allow 列表里。

[bans]
multiple-versions = "warn"
wildcards         = "deny"   # 禁止 version = "*"
# workspace 内部的 path 依赖没有版本号，cargo-deny 会把它当成通配符。
# 本仓库不发布到 crates.io，因此放行；改为发布时要给内部 crate 加 version。
allow-wildcard-paths = true
# 这些 crate 一旦出现，说明有人绕过了既定选型
deny = [
  { name = "openssl",     reason = "统一用 rustls，见 docs/14 §7.3" },
  { name = "openssl-sys", reason = "同上" },
  { name = "reqwest",     reason = "会自动解压/重定向，破坏透明性，见 docs/02 §13-A（宪法 C1）" },
  { name = "chrono",      reason = "已标记为不再维护（RUSTSEC-2026-0543），统一用 jiff，见 docs/19 §7.3" },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
